  user-service:
    build: ./services/user-service
    ports: ["${USER_EXTERNAL_PORT}:8000", "5679:5678"]
    volumes:
      - ./services/user-service:/app
      - ${CERT_DIR}:/certs
    env_file:
      - .env
      - ./services/user-service/.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      python -m uvicorn app.main:app 
      --host 0.0.0.0 --port 8000 --reload
      --ssl-keyfile /certs/${SHARED_SSL_KEY_FILE} 
      --ssl-certfile /certs/${SHARED_SSL_CERT_FILE}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    networks: [backend]

  rag-service:
    build: ./services/rag-service
    ports: ["${RAG_EXTERNAL_PORT}:8000", "5680:5678"]
    volumes:
      - ./services/rag-service:/app
      - ${CERT_DIR}:/certs
    env_file:
      - .env
      - ./services/rag-service/.env
    environment:
      QDRANT_ADDR: qdrant:6334
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000 --reload
      --ssl-keyfile /certs/${SHARED_SSL_KEY_FILE} 
      --ssl-certfile /certs/${SHARED_SSL_CERT_FILE}
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    networks: [backend]

  ingest-service:
    build: ./services/ingest-service
    ports: ["${INGEST_EXTERNAL_PORT}:8000", "5681:5678"]
    volumes:
