networks:
  backend:

services:
  redis:
    image: redis:8.6.4
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # environment:
    #   - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

volumes:
  redis-data:
    driver: local
